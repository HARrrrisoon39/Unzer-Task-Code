<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Checkout — Unzer Shop Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    h1   { font-size: 1.4rem; margin-bottom: 24px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: .85rem; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background: #fc1154; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 16px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status-msg { margin-top: 16px; padding: 12px; border-radius: 4px; display: none; }
    #status-msg.info    { background: #e8f4fd; border: 1px solid #90caf9; }
    #status-msg.success { background: #e8f5e9; border: 1px solid #a5d6a7; }
    #status-msg.error   { background: #ffebee; border: 1px solid #ef9a9a; }
    #card-section, #redirect-section { display: none; }
  </style>
</head>
<body>
  <h1>Unzer Shop — Demo Checkout</h1>

  <!-- Step 1: shipping & method selection -->
  <div id="step-initiate">
    <div class="field">
      <label>Payment method</label>
      <select id="method">
        <option value="CARD">Credit / Debit Card</option>
        <option value="WERO">Wero</option>
        <option value="OPEN_BANKING">Open Banking</option>
      </select>
    </div>
    <div class="field"><label>Street</label><input id="street" value="Musterstraße 1"/></div>
    <div class="field"><label>City</label><input id="city" value="Berlin"/></div>
    <div class="field"><label>Country</label><input id="country" value="DE"/></div>
    <div class="field"><label>ZIP</label><input id="zip" value="10115"/></div>
    <button id="btn-initiate">Continue to payment</button>
  </div>

  <!-- Step 2a: card tokenization via Unzer UI Components -->
  <div id="card-section">
    <h2 style="font-size:1.1rem">Enter card details</h2>
    <!-- publicKey injected by JS after /initiate response -->
    <unzer-payment id="unzer-payment" locale="de-DE">
      <unzer-card></unzer-card>
    </unzer-payment>
    <unzer-checkout id="unzer-checkout">
      <button type="submit" id="btn-pay-card">Pay now</button>
    </unzer-checkout>
  </div>

  <!-- Step 2b: redirect methods (Wero / Open Banking) — just a button -->
  <div id="redirect-section">
    <p>You will be redirected to complete the payment.</p>
    <button id="btn-pay-redirect">Pay with <span id="method-label"></span></button>
  </div>

  <div id="status-msg"></div>

  <!-- Unzer UI Components — loaded only when card is selected -->
  <script type="module" src="https://static-v2.unzer.com/v2/ui-components/index.js"></script>
  <script>
    const SESSION = 'demo-session-' + Math.random().toString(36).slice(2);
    let orderId = null;
    let publicKey = null;

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = type;
      el.style.display = 'block';
    }

    // ── Step 1: initiate checkout ──────────────────────────────────────────────
    document.getElementById('btn-initiate').addEventListener('click', async () => {
      const method = document.getElementById('method').value;
      document.getElementById('btn-initiate').disabled = true;

      // Add a demo item to cart first
      await fetch('/api/cart/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Session-Token': SESSION },
        body: JSON.stringify({
          variantId: 'bbbbbbbb-0000-0000-0000-000000000001',
          sku: 'WIDGET-001-STD', name: 'Premium Widget Standard',
          quantity: 1, unitPrice: 29.99, currency: 'EUR'
        })
      });

      const res = await fetch('/api/checkout/initiate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Session-Token': SESSION },
        body: JSON.stringify({
          street: document.getElementById('street').value,
          city:   document.getElementById('city').value,
          country: document.getElementById('country').value,
          zip:    document.getElementById('zip').value
        })
      });

      const data = await res.json();
      if (!res.ok) { showStatus(data.message || 'Checkout failed', 'error'); return; }

      orderId = data.orderId;
      publicKey = data.publicKey;
      document.getElementById('step-initiate').style.display = 'none';

      if (method === 'CARD') {
        document.getElementById('card-section').style.display = 'block';
        // Set publicKey on the Unzer component once it's defined
        customElements.whenDefined('unzer-payment').then(() => {
          document.getElementById('unzer-payment').setAttribute('publicKey', publicKey);
        });
        setupCardPayment();
      } else {
        document.getElementById('method-label').textContent =
          method === 'WERO' ? 'Wero' : 'Open Banking';
        document.getElementById('redirect-section').style.display = 'block';
        document.getElementById('btn-pay-redirect').addEventListener('click', () =>
          initiatePayment(method, null));
      }
    });

    // ── Card: wire up Unzer UI Component submit handler ────────────────────────
    function setupCardPayment() {
      customElements.whenDefined('unzer-payment').then(() => {
        const checkout = document.getElementById('unzer-checkout');
        checkout.onPaymentSubmit = async (response) => {
          if (response.submitResponse && response.submitResponse.success) {
            const typeId = response.submitResponse.data.id;
            await initiatePayment('CARD', typeId);
          } else {
            showStatus('Card tokenization failed — check card details', 'error');
          }
        };
      });
    }

    // ── Step 2: initiate payment ───────────────────────────────────────────────
    async function initiatePayment(method, typeId) {
      showStatus('Processing payment…', 'info');
      const res = await fetch('/api/checkout/pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, method, typeId })
      });
      const data = await res.json();
      if (!res.ok) { showStatus(data.message || 'Payment failed', 'error'); return; }

      if (data.action === 'REDIRECT' && data.redirectUrl) {
        window.location.href = data.redirectUrl;
      } else {
        pollStatus();
      }
    }

    // ── Step 3: poll for final status after return from redirect ───────────────
    function pollStatus() {
      const params = new URLSearchParams(window.location.search);
      const oid = params.get('orderId') || orderId;
      if (!oid) return;
      const interval = setInterval(async () => {
        const res = await fetch('/api/checkout/status?orderId=' + oid);
        const data = await res.json();
        if (data.status === 'PAID' || data.status === 'COMPLETED') {
          clearInterval(interval);
          showStatus('Payment confirmed! Order ' + oid, 'success');
        } else if (data.status === 'PAYMENT_FAILED' || data.status === 'CANCELLED') {
          clearInterval(interval);
          showStatus('Payment failed. Order status: ' + data.status, 'error');
        }
      }, 2000);
    }

    // Auto-poll if this is a return-URL page
    if (window.location.search.includes('orderId')) pollStatus();
  </script>
</body>
</html>
