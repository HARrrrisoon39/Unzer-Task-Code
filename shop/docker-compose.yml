version: "3.9"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopdb
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: shop
      UNZER_PRIVATE_KEY: ${UNZER_PRIVATE_KEY}
      UNZER_PUBLIC_KEY: ${UNZER_PUBLIC_KEY}
      UNZER_RETURN_URL_BASE: ${UNZER_RETURN_URL_BASE:-http://localhost:8080}
      UNZER_WEBHOOK_URL: ${UNZER_WEBHOOK_URL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
    depends_on:
      db:
        condition: service_healthy
